<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MediBook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-brand">
      <a href="index.html" class="logo" style="color: white; margin-bottom: 2rem; position: absolute; top: 2rem; left: 2rem;">
        <i class="fas fa-heartbeat"></i> MediBook
      </a>
      <h1>Join MediBook.</h1>
      <p>Create an account to start managing your healthcare journey.</p>
    </div>
    
    <div class="auth-form-wrapper">
      <div class="auth-form-header">
        <h2>Create Account</h2>
        <p>Fill in your details to get started</p>
      </div>
      
      <form id="registerForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" required>
          </div>
          
          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="regRole">I am a...</label>
          <select id="regRole" required>
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
          </select>
        </div>
        
        <div class="form-group" id="specContainer" style="display: none;">
          <label for="regSpec">Specialization</label>
          <input type="text" id="regSpec" placeholder="e.g., Cardiology">
        </div>
        
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Minimum 8 characters" minlength="8" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Register
        </button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
