<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard | MediBook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-heartbeat"></i> MediBook
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" onclick="showSection('appointments', event)">
          <i class="fas fa-calendar-alt"></i> Appointments
          <span id="notificationCount" class="notification-badge" style="display:none;">0</span>
        </div>
        <div class="nav-item" onclick="showSection('medical-records', event)">
          <i class="fas fa-file-medical"></i> Medical Records
        </div>
        <div class="nav-item" onclick="showSection('profile', event)">
          <i class="fas fa-user"></i> Profile
        </div>
      </nav>
      
      <!-- Logout at bottom -->
      <div style="padding: 1.5rem;">
        <button onclick="logout()" class="btn btn-secondary" style="width: 100%; color: white; border-color: rgba(255,255,255,0.2);">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle"><i class="fas fa-bars"></i></button>
          <h2 style="margin:0; font-size:1.25rem;">Patient Dashboard</h2>
        </div>
        <div class="header-right">
          <button class="icon-btn theme-toggle" title="Toggle Theme"><i class="fas fa-moon"></i></button>
          
          <div class="notif-container" id="notifDropdownContainer">
            <button class="icon-btn" id="notifBtn" onclick="toggleNotificationDropdown()" title="Notifications">
              <i class="fas fa-bell"></i>
              <!-- Badge injected by JS -->
            </button>
            <div class="notif-dropdown" id="notifDropdown">
              <!-- Notifications injected by JS -->
            </div>
          </div>
          
          <button onclick="logout()" class="icon-btn" style="color: var(--danger);" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
          </button>
          
          <div class="user-profile">
            <div class="user-info">
              <span class="user-name">Patient Name</span>
              <span class="user-role">Patient</span>
            </div>
            <div class="avatar">P</div>
          </div>
        </div>
      </header>

      <!-- Scrollable Content -->
      <div class="content-area">
        
        <div id="appointments" class="section active">
          
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon blue"><i class="fas fa-calendar-check"></i></div>
              <div class="stat-details">
                <h3>Upcoming Appointments</h3>
                <div class="stat-number" id="stat-upcoming">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon green"><i class="fas fa-history"></i></div>
              <div class="stat-details">
                <h3>Past Appointments</h3>
                <div class="stat-number" id="stat-past">0</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Book New Appointment</h2>
            </div>
            <form id="appointmentForm">
              <div class="form-grid">
                <div class="form-group">
                  <label>Specialization</label>
                  <select id="specializationSelect" required>
                    <option value="">Select Specialization</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Doctor</label>
                  <select id="doctorSelect" required>
                    <option value="">Select Doctor</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Date</label>
                  <input type="date" id="appointmentDate" required>
                </div>
                <div class="form-group">
                  <label>Time</label>
                  <select id="appointmentTime" required></select>
                </div>
              </div>
              <div class="form-group">
                <label>Notes / Symptoms</label>
                <textarea id="appointmentNotes" placeholder="Any specific concerns?"></textarea>
              </div>
              <button type="submit" class="btn btn-primary"><i class="fas fa-calendar-plus"></i> Book Appointment</button>
            </form>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Upcoming Appointments</h2>
            </div>
            <div id="upcomingAppointments" class="list-grid"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Past Appointments</h2>
            </div>
            <div id="pastAppointments" class="list-grid"></div>
          </div>
        </div>

        <div id="medical-records" class="section">
          <div class="card">
            <div class="card-header">
              <h2>Medical History</h2>
            </div>
            <div id="medicalHistory" class="list-grid"></div>
          </div>
          
          <div class="card">
            <div class="card-header">
              <h2>Prescriptions</h2>
            </div>
            <div id="prescriptions" class="list-grid"></div>
          </div>
        </div>

        <div id="profile" class="section">
          <div class="card">
            <div class="card-header">
              <h2>Personal Information</h2>
            </div>
            <form id="profileForm">
              <div class="form-grid">
                <div class="form-group">
                  <label>Full Name</label>
                  <input type="text" id="fullName">
                </div>
                <div class="form-group">
                  <label>Date of Birth</label>
                  <input type="date" id="dob">
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="email">
                </div>
                <div class="form-group">
                  <label>Phone Number</label>
                  <input type="tel" id="phone">
                </div>
              </div>
              <div class="form-group">
                <label>Address</label>
                <textarea id="address"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/patient.js"></script>
</body>
</html>
