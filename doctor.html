<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard | MediBook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-heartbeat"></i> MediBook
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" onclick="showSection('schedule', event)">
          <i class="fas fa-calendar-day"></i> Today's Schedule
        </div>
        <div class="nav-item" onclick="showSection('patients', event)">
          <i class="fas fa-users"></i> Patient Records
        </div>
        <div class="nav-item" onclick="showSection('prescriptions', event)">
          <i class="fas fa-prescription-bottle-alt"></i> Prescriptions
        </div>
        <div class="nav-item" onclick="showSection('profile', event)">
          <i class="fas fa-user-md"></i> Profile
        </div>
      </nav>
      
      <div style="padding: 1.5rem;">
        <button onclick="logout()" class="btn btn-secondary" style="width: 100%; color: white; border-color: rgba(255,255,255,0.2);">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle"><i class="fas fa-bars"></i></button>
          <h2 style="margin:0; font-size:1.25rem;">Doctor Dashboard</h2>
        </div>
        <div class="header-right">
          <button class="icon-btn theme-toggle" title="Toggle Theme"><i class="fas fa-moon"></i></button>
          
          <div class="notif-container" id="notifDropdownContainer">
            <button class="icon-btn" id="notifBtn" onclick="toggleNotificationDropdown()" title="Notifications">
              <i class="fas fa-bell"></i>
            </button>
            <div class="notif-dropdown" id="notifDropdown"></div>
          </div>
          
          <button onclick="logout()" class="icon-btn" style="color: var(--danger);" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
          </button>
          
          <div class="user-profile">
            <div class="user-info">
              <span class="user-name">Dr. Name</span>
              <span class="user-role">Specialization</span>
            </div>
            <div class="avatar">D</div>
          </div>
        </div>
      </header>

      <!-- Scrollable Content -->
      <div class="content-area">
        
        <div id="schedule" class="section active">
          
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon blue"><i class="fas fa-calendar-check"></i></div>
              <div class="stat-details">
                <h3>Today's Appointments</h3>
                <div class="stat-number" id="todayAppointments">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon amber"><i class="fas fa-clock"></i></div>
              <div class="stat-details">
                <h3>Pending Approval</h3>
                <div class="stat-number" id="pendingAppointments">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon green"><i class="fas fa-users"></i></div>
              <div class="stat-details">
                <h3>Total Patients</h3>
                <div class="stat-number" id="totalPatients">0</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Today's Schedule</h2>
            </div>
            <div id="todaySchedule" class="list-grid"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Upcoming Appointments</h2>
            </div>
            <div id="upcomingSchedule" class="list-grid"></div>
          </div>
        </div>

        <div id="patients" class="section">
          <div class="card">
            <div class="card-header">
              <h2>Patient Directory</h2>
            </div>
            <div class="search-container">
              <i class="fas fa-search"></i>
              <input type="text" id="patientSearch" placeholder="Search patients by name...">
            </div>
            <div id="patientList" class="list-grid"></div>
          </div>
        </div>

        <div id="prescriptions" class="section">
          <div class="card">
            <div class="card-header">
              <h2>Issue Prescription</h2>
            </div>
            <form id="prescriptionForm">
              <div class="form-grid">
                <div class="form-group">
                  <label>Patient</label>
                  <select id="patientSelect" required>
                    <option value="">Select Patient</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Medication Name</label>
                  <input type="text" id="medication" required>
                </div>
                <div class="form-group">
                  <label>Dosage</label>
                  <input type="text" id="dosage" placeholder="e.g., 500mg" required>
                </div>
                <div class="form-group">
                  <label>Duration</label>
                  <input type="text" id="duration" placeholder="e.g., 7 days" required>
                </div>
              </div>
              <div class="form-group">
                <label>Instructions / Notes</label>
                <textarea id="instructions" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary"><i class="fas fa-pills"></i> Issue Prescription</button>
            </form>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Recent Prescriptions</h2>
            </div>
            <div id="recentPrescriptions" class="list-grid"></div>
          </div>
        </div>

        <div id="profile" class="section">
          <div class="card">
            <div class="card-header">
              <h2>Doctor Profile</h2>
            </div>
            <form id="profileForm">
              <div class="form-grid">
                <div class="form-group">
                  <label>Full Name</label>
                  <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="email" required>
                </div>
                <div class="form-group">
                  <label>Phone</label>
                  <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                  <label>Specialization</label>
                  <input type="text" id="specialization" required>
                </div>
              </div>
              <div class="form-group">
                <label>Qualifications</label>
                <textarea id="qualifications" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/doctor.js"></script>
</body>
</html>
